          description: ''
        '401':
          content:
            application/json:
              schema:
                example:
                  error_detail: 자격 인증 데이터가 제공되지 않았습니다.
          description: ''
        '403':
          content:
            application/json:
              schema:
                example:
                  error_detail: 권한이 없습니다.
          description: ''
        '404':
          content:
            application/json:
              schema:
                example:
                  error_detail: 강의 정보를 찾을 수 없습니다.
          description: ''
  /api/v1/applications/{application_uuid}:
    get:
      operationId: api_v1_applications_retrieve
      description: '[REQ-APLY-007] 내가 지원한 상세 조회'
