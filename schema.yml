  /api/v1/chatroom/{group_id}/members/{member_id}/read/:
    post:
      operationId: api_v1_chatroom_members_read_create
      summary: 채팅방 읽음 처리 API
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
