      - TODAY_SCHEDULE
      - UPCOMING_SCHEDULE
      type: string
      description: |-
        * `STUDY_JOIN` - 스터디 그룹에 새로운 구성원이 참가한 경우 알림
        * `STUDY_NOTE_CREATE` - 스터디 구성원이 스터디 기록을 작성한 경우 알림
        * `STUDY_REVIEW_REQUEST` - 스터디 종료가 도래한 경우 알림
        * `APPLICATION_ACCEPT` - 지원내역이 승인된 경우 알림
        * `APPLICATION_REJECT` - 지원내역이 거절된 경우 알림
