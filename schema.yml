      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                example:
                  detail: 알림 읽음처리에 성공하였습니다.
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                example:
                  error_detail: 자격 인증 데이터가 제공되지 않았습니다.
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                example:
                  error_detail: 권한이 없습니다.
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                example:
                  error_detail: 해당 알림 내역을 찾을 수 없습니다.
          description: ''
  /api/v1/notificationsread-all:
    post:
      operationId: api_v1_notificationsread_all_create
      summary: 로그인 유저가 수신한 알림중 읽지 않은 모든 알림을 읽음 처리하는 API 입니다.
      tags:
      - notification
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
