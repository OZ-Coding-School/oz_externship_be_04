          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/lectures:
    get:
      operationId: api_v1_lectures_list
      summary: 크롤링된 강의 목록을 조회하는 API입니다.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 원하는 페이지 번호를 입력하여 해당하는 페이지의 강의 내용을 가져올 수 있습니다.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 한 페이지에 나타내는 강의 목록의 수를 조절할 수 있습니다.
      - in: query
        name: search
        schema:
          type: string
        description: 강의 제목 또는 강사 이름으로 검색합니다.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - high_price
          - high_rating
          - latest
          - low_price
          - low_rating
          - oldest
        description: "\n아래의 정렬 기준을 선택할 수 있습니다:\n- latest : 최신순으로 정렬\n- oldest : 오래된순으로\
          \ 정렬\n- low_price : 낮은 가격순으로 정렬\n- high_price : 높은 가격순으로 정렬\n- high_rating\
          \ : 높은 리뷰 평점순으로 정렬\n- low_rating : 낮은 리뷰 평점순으로 정렬\n                "
      tags:
      - lectures
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCrawledLectureList'
          description: ''
        '500':
          content:
            application/json:
              schema:
                example:
                  error_detail: 서버에서 알 수 없는 오류가 발생했습니다.
          description: ''
  /api/v1/messages/{message_id}/:
