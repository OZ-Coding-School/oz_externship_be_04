openapi: 3.0.3
info:
  title: 오즈 코딩 스쿨 Backend API
  version: 1.0.0
  description: 오즈 코딩 스쿨의 웹 사이트 개발을 위한 API입니다.
paths:
  /api/v1/admin/account:
    get:
      operationId: api_v1_admin_account_retrieve
      description: 어드민 페이지 회원 목록 조회용 Spec API입니다.
      summary: 어드민 페이지 회원 목록 조회 Spec
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: '페이지 번호 / 기본값: 1'
      - in: query
        name: page_size
        schema:
          type: integer
        description: '페이지 당 개수 / 기본값: 10'
      - in: query
        name: q
        schema:
          type: string
        description: 검색 (이메일, 닉네임, 이름)
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - staff
          - user
        description: 권한 필터 (user, staff, admin)
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
          - withdrew
        description: 상세 필터 (active, inactive, withdrew)
      tags:
      - Admin
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
              examples:
                SuccessExample:
                  value:
                    count: 4018
                    next: http://api.ozcoding.site/api/v1/admin/accounts?page=1&page_size=10
                    previous: null
                    results:
                    - id: 1
                      email: user@example.com
                      nickname: string
                      name: string
                      birthday: '2025-11-20'
                      status: active
                      role: user
                      withdraw_at: '2025-10-30T14:01:57.505250+09:00'
                      created_at: '2025-10-30T14:01:57.505250+09:00'
                  summary: Success Example
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                UnauthorizedExample:
                  value:
                    error_detail: 자격 인증 데이터가 제공되지 않았습니다.
                  summary: Unauthorized Example
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ForbiddenExample:
                  value:
                    error_detail: 권한이 없습니다.
                  summary: Forbidden Example
          description: ''
  /api/v1/admin/account/{account_id}:
    get:
      operationId: api_v1_admin_account_retrieve_2
      description: 어드민 페이지 회원 정보 상세 조회용 Spec API입니다.
      summary: 어드민 페이지 회원 정보 상세 조회 Spec
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
              examples:
                SuccessExample:
                  value:
                    id: 1
                    name: 홍승우
                    gender: M
                    nickname: user1
                    birthday: '2005-01-01'
                    phone_number: 01012345678
                    email: user1@example.com
                    role: user
                    status: active
                    created_at: '2005-01-01T13:00:47.50525+09:00'
                    profile_img_url: https://example.com/profile/user1.png
                  summary: Success Example
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                UnauthorizedExample:
                  value:
                    error_detail: 자격 인증 데이터가 제공되지 않았습니다.
                  summary: Unauthorized Example
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ForbiddenExample:
                  value:
                    error_detail: 권한이 없습니다.
                  summary: Forbidden Example
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotfoundExample:
                  value:
                    error_detail: 사용자 정보를 찾을 수 없습니다.
                  summary: Notfound Example
          description: ''
  /api/v1/admin/applications:
    get:
      operationId: admin_application_list
      description: '[REQ-APLY-009] 관리자용 지원서 목록 조회'
      summary: Admin 지원서 목록 조회
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: 공고 제목 검색
      - in: query
        name: sort
        schema:
          type: string
        description: latest | oldest
      - in: query
        name: status
        schema:
          type: string
        description: 지원 상태 필터
      tags:
      - Application - Admin
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApplicationList'
          description: ''
  /api/v1/admin/applications/{application_uuid}:
    get:
      operationId: api_v1_admin_applications_retrieve
      description: '[REQ-APLY-010] 관리자용 지원서 상세 조회'
      summary: Admin 지원서 상세 조회
      parameters:
      - in: path
