      description: 프론트엔드가 S3에 직접 파일을 업로드하기 위한 Presigned URL을 발급합니다.
      summary: S3 Presigned URL 발급
      parameters:
      - in: query
        name: content_type
        schema:
          type: string
        description: 'MIME type (예: image/png, application/pdf)'
        required: true
      - in: query
        name: file_ext
        schema:
          type: string
        description: '파일 확장자 (예: png, pdf)'
        required: true
      - in: query
        name: file_name
        schema:
          type: string
        description: 원본 파일명
        required: true
      - in: query
        name: type
        schema:
          type: string
          enum:
          - NOTE_ATTACHMENT
          - NOTE_IMAGE
          - RECRUITMENT_ATTACHMENT
          - RECRUITMENT_IMAGE
          - STUDY_GROUP_IMAGE
          - USER_PROFILE_IMAGE
        description: 파일 타입
        required: true
      tags:
      - Common
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 성공
                content:
                  application/json:
                    example:
                      upload_url: https://study-hub.s3.ap-northeast-2.amazonaws.com/uploads/users/profiles/uuid.png?X-Amz-Algorithm=...
                      file_url: https://study-hub.s3.ap-northeast-2.amazonaws.com/uploads/users/profiles/uuid.png
                      key: uploads/users/profiles/uuid.png
                      headers:
                        Content-Type: image/png
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: 잘못된 요청
                content:
                  application/json:
                    examples:
                      missing_params:
                        summary: 필수 파라미터 누락
                        value:
                          error_detail:
                            type:
                            - 이 필드는 필수 항목입니다.
                      invalid_type:
                        summary: 유효하지 않은 파일 타입
                        value:
                          error_detail: '유효하지 않은 파일 타입: INVALID_TYPE'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: 인증 실패
                content:
                  application/json:
                    example:
                      error_detail: 자격 인증 데이터가 제공되지 않았습니다.
          description: ''
